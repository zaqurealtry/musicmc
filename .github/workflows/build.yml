name: Build

# Builds the mod jar on every branch push and pull request so there's always a
# downloadable test build. Tagged releases (v*) are handled by build-release.yml.
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Work out build version
        id: version
        run: |
          base=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${base}+build.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Building ${base}+build.${short_sha}"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.version }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: music-mc-${{ steps.version.outputs.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ steps.version.outputs.version }}
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
